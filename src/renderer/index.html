<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; frame-src file:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' file: blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co;">
<title>Majlis</title>
<link rel="stylesheet" href="../../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="../../build/icon.png" alt="">
      <span>Majlis</span>
    </div>
    <button id="newChat" class="btn-new"><span class="ico">＋</span><span data-i18n="new_chat"></span></button>
    <input id="search" class="search" data-i18n-ph="search">
    <nav id="convList"></nav>
    <div class="side-foot">
      <div id="providerDots" class="provider-dots"></div>
      <button id="openAutos" class="btn-ghost"><span class="ico">⏰</span><span data-i18n="autos"></span></button>
      <button id="openSettings" class="btn-ghost"><span class="ico">⚙</span><span data-i18n="settings"></span></button>
    </div>
  </aside>

  <main id="chat">
    <header class="chat-head">
      <input id="convTitle" class="conv-title" spellcheck="false">
      <button id="wsChip" class="chip ws-chip"><span class="ico">📁</span><span id="wsLabel"></span></button>
      <div id="updateBar" class="update-bar hidden"></div>
    </header>
    <div id="authBanner" class="auth-banner hidden"></div>

    <section id="messages">
      <div id="welcome" class="welcome">
        <img src="../../build/icon.png" alt="" class="welcome-logo">
        <h1 data-i18n="welcome_title"></h1>
        <p data-i18n="welcome_sub"></p>
        <div class="examples">
          <button data-ex="ex1"></button><button data-ex="ex2"></button>
          <button data-ex="ex3"></button><button data-ex="ex4"></button>
        </div>
      </div>
      <div id="thread"></div>
    </section>

    <footer class="composer-wrap">
      <div id="voiceBar" class="voice-bar hidden">
        <div class="vb-state"><span id="vbIcon">🎙</span><span id="vbText"></span></div>
        <div id="vbLevel" class="vb-level"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button id="vbStop" class="vb-stop"></button>
      </div>
      <div id="composer" class="composer">
        <div id="promptMenu" class="prompt-menu hidden"></div>
        <div id="attachList" class="attach-list"></div>
        <textarea id="input" rows="1" data-i18n-ph="placeholder"></textarea>
        <div class="composer-bar">
          <button id="attachBtn" class="icon-btn" data-i18n-title="attach">📎</button>
          <button id="micBtn" class="icon-btn mic" data-i18n-title="mic_title">🎙</button>
          <button id="improveBtn" class="voice-mode" data-i18n-title="improve_title"><span class="ico">✨</span><span data-i18n="improve"></span></button>
          <button id="promptsBtn" class="icon-btn" data-i18n-title="prompts_title">📚</button>
          <button id="projectBtn" class="voice-mode council-btn" data-i18n-title="project_title"><span class="ico">🏗</span><span data-i18n="project"></span></button>
          <button id="compareBtn" class="voice-mode council-btn" data-i18n-title="compare_title"><span class="ico">⚖</span><span data-i18n="compare"></span></button>
          <button id="previewBtn" class="icon-btn" data-i18n-title="pv_toggle">👁</button>
          <button id="councilBtn" class="voice-mode council-btn" data-i18n-title="council_title"><span class="ico">🏛</span><span data-i18n="council"></span></button>
          <button id="voiceModeBtn" class="voice-mode" data-i18n-title="voice_mode_title"><span class="ico">🎧</span><span data-i18n="voice_mode"></span></button>
          <select id="modelPick" class="model-pick"></select>
          <div class="grow"></div>
          <button id="sendBtn" class="send-btn" data-i18n-title="send">↑</button>
        </div>
      </div>
      <div id="dropHint" class="drop-hint hidden" data-i18n="drop_here"></div>
    </footer>
  </main>
  <aside id="preview" class="preview hidden">
    <div class="pv-head">
      <button id="pvTabView" class="pv-tab on"></button><button id="pvTabFiles" class="pv-tab"></button>
      <div class="grow"></div>
      <button id="pvRules" class="icon-btn" data-i18n-title="pv_rules">📝</button>
      <button id="pvReload" class="icon-btn" data-i18n-title="pv_reload">⟳</button>
      <button id="pvExternal" class="icon-btn" data-i18n-title="pv_external">↗</button>
      <button id="pvFolder" class="icon-btn" data-i18n-title="pv_folder">📂</button>
      <button id="pvClose" class="icon-btn">✕</button>
    </div>
    <div class="pv-body">
      <iframe id="pvFrame" sandbox="allow-scripts allow-forms allow-popups allow-same-origin" title="preview"></iframe>
      <div id="pvFiles" class="pv-files hidden"></div>
      <div id="pvEmpty" class="pv-empty"></div>
    </div>
  </aside>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="../../node_modules/marked/lib/marked.umd.js"></script>
<script src="../../node_modules/dompurify/dist/purify.min.js"></script>
<script src="../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
<script src="i18n.js"></script>
<script src="voice.js"></script>
<script type="module" src="asr.js"></script>
<script src="app.js"></script>
</body>
</html>
