name: Probe CLIs

# Diagnostics on a clean Windows machine.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Print the Antigravity installer script
        shell: pwsh
        run: |
          $s = Invoke-RestMethod https://antigravity.google/cli/install.ps1
          Write-Host "=====BEGIN====="
          Write-Host $s
          Write-Host "=====END====="
      - name: agy tools and image capability
        shell: pwsh
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          irm https://antigravity.google/cli/install.ps1 | iex
          $agy = "$env:LOCALAPPDATA\agy\bin\agy.exe"
          & $agy help 2>&1 | Out-String
          & $agy plugins --help 2>&1 | Out-String
          & $agy mcp --help 2>&1 | Out-String
