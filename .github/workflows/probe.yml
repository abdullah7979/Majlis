name: Probe CLIs

# Diagnostics: install the vendor CLIs on a clean Windows machine and print their real help text.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Install Antigravity CLI
        shell: powershell
        run: |
          irm https://antigravity.google/cli/install.ps1 | iex
      - name: Print agy help
        shell: cmd
        continue-on-error: true
        run: |
          set AGY=%LOCALAPPDATA%\agy\bin\agy.exe
          echo ===== version & "%AGY%" --version 2>&1
          echo ===== help & "%AGY%" --help 2>&1
          echo ===== models help & "%AGY%" models --help 2>&1
          echo ===== models & "%AGY%" models 2>&1
          echo ===== headless & echo say hi | "%AGY%" -p "hello" --output-format stream-json 2>&1
          echo ===== exit %ERRORLEVEL%
          echo ===== dirs & dir /s /b "%USERPROFILE%\.gemini" 2>&1
          dir /s /b "%LOCALAPPDATA%\agy" 2>&1
