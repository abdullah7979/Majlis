name: Probe CLIs

# Diagnostics: install the vendor CLIs on a clean Windows machine and print their real help text.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Install Antigravity CLI
        shell: powershell
        run: |
          irm https://antigravity.google/cli/install.ps1 | iex
      - name: Probe agy headless input
        shell: cmd
        continue-on-error: true
        run: |
          set AGY=%LOCALAPPDATA%\agy\bin\agy.exe
          echo {"event":"user","message":{"content":"hi"}}> in.jsonl
          echo ===== A: -p + stream-json stdin
          "%AGY%" -p --input-format stream-json --output-format stream-json --print-timeout 5s < in.jsonl 2>&1
          echo ===== exit %ERRORLEVEL%
          echo ===== B: -p + text stdin
          echo hello there| "%AGY%" -p --output-format stream-json --print-timeout 5s 2>&1
          echo ===== exit %ERRORLEVEL%
          echo ===== C: mode values
          "%AGY%" -p "x" --mode bogus --print-timeout 3s 2>&1
          echo ===== exit %ERRORLEVEL%
          echo ===== D: help print
          "%AGY%" help print 2>&1
          "%AGY%" help models 2>&1
