name: Probe CLIs

# Diagnostics: install the vendor CLIs on a clean Windows machine and print their real help text.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install agy the way Majlis does, into an Arabic user path with a space
        run: node test/windows/agy-install.js
