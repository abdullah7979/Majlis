name: Release

# Publishes a GitHub Release (tag v<package.json version>) with the Windows installer.
# Run it from the Actions tab ("Run workflow") after bumping the version, or push a v* tag.
# Installed copies of Majlis update themselves from these releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron . --smoke-test
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish one release with all files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          # remove any earlier/duplicate release for this version, then publish exactly one
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$V\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$V" dist/Majlis-Setup-*.exe dist/Majlis-Setup-*.exe.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" --title "Majlis $V" --latest \
            --notes "Install or update: open PowerShell and run \`irm https://raw.githubusercontent.com/abdullah7979/majlis/main/install.ps1 | iex\` — installed copies update themselves."
          sleep 10
          curl -fsIL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.yml" > /dev/null && echo "latest.yml is downloadable"
